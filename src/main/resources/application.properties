# Configuration file: database connection and JPA settings.

# ---- PLACEHOLDERS: put your real MySQL values in application-local.properties (git-ignored), or edit them here ----
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
# --------------------------------------------------

# Backend port (the frontend runs on 3000 and calls this port).
server.port=8080

# "update" creates missing tables/columns but never deletes data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
